<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGP画像ジェネレーター | りょがサポ（開発用）</title>
<!-- Adobe Fonts（サイト本体と同じキット） -->
<script>
  (function(d) {
    var config = {
      kitId: 'yoo6wko',
      scriptTimeout: 3000,
      async: true
    },
    h=d.documentElement,t=setTimeout(function(){h.className=h.className.replace(/\bwf-loading\b/g,"")+" wf-inactive";},config.scriptTimeout),tk=d.createElement("script"),f=false,s=d.getElementsByTagName("script")[0],a;h.className+=" wf-loading";tk.src='https://use.typekit.net/'+config.kitId+'.js';tk.async=true;tk.onload=tk.onreadystatechange=function(){a=this.readyState;if(f||a&&a!="complete"&&a!="loaded")return;f=true;clearTimeout(t);try{Typekit.load(config)}catch(e){}};s.parentNode.insertBefore(tk,s)
  })(document);
</script>
<style>
body{font-family:"Zen Kaku Gothic New",sans-serif;background:#EAF2FB;color:#121C42;margin:0;padding:24px;line-height:1.8}
h1{font-size:16px}
p{font-size:12.5px;max-width:640px}
canvas{width:600px;max-width:100%;height:auto;border:1px solid rgba(18,28,66,.2);border-radius:8px;background:#fff;display:block;margin:14px 0}
button{font:700 13px "Zen Kaku Gothic New",sans-serif;background:#121C42;color:#fff;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;margin-right:10px}
#status{font-size:12px;color:#4E5A88}
</style>
</head>
<body>
<h1>OGP画像ジェネレーター（1200x630）</h1>
<p>フォント読み込み後に自動で描画されます。「JPGをダウンロード」で保存し、<b>assets/ogp.jpg</b> に上書きしてください。写真やロゴ、文言を変えたいときは、このファイル内の draw() を編集します。</p>
<canvas id="cv" width="1200" height="630"></canvas>
<button id="dl" type="button">JPGをダウンロード</button>
<span id="status">フォント読み込み待ち…</span>

<script>
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=1200,H=630;
const INK='#121C42', COBALT='#3A4FD0', SKY='#9FB0F6', SKYSOFT='#D6DDFC', SKYDEEP='#7D8FEF', SPARK='#FFD84D', SOFT='#4E5A88';

const img=new Image(); img.src='assets/ryoga-02-cut.png';
const logo=new Image(); logo.src='assets/ko1keyz-logo.png';

function fontsReady(){
  const c=document.createElement('canvas').getContext('2d');
  const w=(f,t)=>{c.font=f;return c.measureText(t).width;};
  const base=w('700 40px monospace','RYOGA 19');
  return w('700 40px "obviously-wide", monospace','RYOGA 19')!==base
      && w('700 40px "neue-haas-grotesk-display", monospace','RYOGA 19')!==base
      && w('700 40px "fot-tsukubrdgothic-std", monospace','RYOGA 19')!==base;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.textBaseline='alphabetic';
  ctx.letterSpacing='0px';

  /* 背景グラデ＋空のウォッシュ */
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#FFFFFF');g.addColorStop(.5,'#F3F5FE');g.addColorStop(1,'#DCE2FD');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  let r1=ctx.createRadialGradient(1050,40,0,1050,40,520);
  r1.addColorStop(0,'rgba(159,176,246,.4)');r1.addColorStop(1,'rgba(159,176,246,0)');
  ctx.fillStyle=r1;ctx.fillRect(0,0,W,H);
  let r2=ctx.createRadialGradient(60,620,0,60,620,480);
  r2.addColorStop(0,'rgba(214,221,252,.85)');r2.addColorStop(1,'rgba(214,221,252,0)');
  ctx.fillStyle=r2;ctx.fillRect(0,0,W,H);

  /* ドット方眼（下へフェード） */
  for(let y=26;y<H;y+=26){
    const a=Math.max(0,.14*(1-y/H*1.15));
    if(a<=0)continue;
    ctx.fillStyle='rgba(58,79,208,'+a+')';
    for(let x=26;x<W;x+=26){ctx.beginPath();ctx.arc(x,y,1.5,0,7);ctx.fill();}
  }

  /* ハロー円（写真の頭の後ろ） */
  let halo=ctx.createRadialGradient(940,170,0,940,170,300);
  halo.addColorStop(0,'rgba(255,255,255,.95)');halo.addColorStop(.6,'rgba(214,221,252,.5)');halo.addColorStop(1,'rgba(214,221,252,0)');
  ctx.fillStyle=halo;ctx.fillRect(0,0,W,H);

  /* ゴースト筆記体 */
  ctx.font='italic 400 150px "Instrument Serif", serif';
  ctx.fillStyle='rgba(58,79,208,.09)';
  ctx.fillText('Ryoga',700,150);

  /* 写真の配置（描画は文字の後＝文字が本人の後ろに潜る） */
  const ph=620, pw=ph*(900/1200), px=W-pw-25, py=H-ph;
  const LX=78;

  /* ロックアップ: RYOGA（白抜き＋コバルトフチ）/ SUPPORT（トラッキング） */
  ctx.font='700 148px "obviously-wide", sans-serif';
  ctx.lineJoin='round';
  ctx.save();
  ctx.shadowColor='rgba(58,79,208,.3)';ctx.shadowBlur=30;ctx.shadowOffsetY=8;
  ctx.strokeStyle=COBALT;ctx.lineWidth=13;
  ctx.strokeText('RYOGA',LX,300);
  ctx.restore();
  ctx.strokeStyle=COBALT;ctx.lineWidth=13;
  ctx.strokeText('RYOGA',LX,300);
  ctx.fillStyle='#FFFFFF';
  ctx.fillText('RYOGA',LX,300);
  const ryW=ctx.measureText('RYOGA').width;

  ctx.font='700 64px "neue-haas-grotesk-display", sans-serif';
  const splain=ctx.measureText('SUPPORT').width;
  ctx.letterSpacing=Math.max(0,(ryW-splain-4)/6)+'px';
  ctx.fillStyle=COBALT;
  ctx.fillText('SUPPORT',LX+4,382);
  ctx.letterSpacing='0px';

  /* 上部: KO1KEYZ公式ロゴの白プレート＋ラベル */
  ctx.save();
  ctx.fillStyle='rgba(125,143,239,.65)';rr(82,66,178,44,22);ctx.fill();
  ctx.fillStyle='#FFFFFF';rr(79,63,178,44,22);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=2;rr(79,63,178,44,22);ctx.stroke();
  const lw=132, lh=lw*(500/2000);
  ctx.drawImage(logo,79+23,63+22-lh/2,lw,lh);
  ctx.restore();
  ctx.font='700 15px "neue-haas-grotesk-display", sans-serif';
  ctx.letterSpacing='4px';
  ctx.fillStyle=SOFT;
  ctx.fillText('FAN SUPPORT HUB',286,91);
  ctx.letterSpacing='0px';

  /* 和文（写真にかからない幅で2行） */
  ctx.font='700 30px "fot-tsukubrdgothic-std", sans-serif';
  ctx.fillStyle=INK;
  ctx.fillText('飯塚亮賀くんファンダム',LX,462);
  ctx.fillText('りょがサポ情報まとめサイト',LX,506);
  ctx.font='700 14px "neue-haas-grotesk-display", sans-serif';
  ctx.letterSpacing='4px';
  ctx.fillStyle=SOFT;
  ctx.fillText('UNOFFICIAL FAN SITE',LX+2,542);
  ctx.letterSpacing='0px';

  /* Xハンドルのステッカーチップ */
  ctx.fillStyle='rgba(125,143,239,.65)';rr(LX+3,565,232,42,21);ctx.fill();
  ctx.fillStyle='#FFFFFF';rr(LX,562,232,42,21);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=2;rr(LX,562,232,42,21);ctx.stroke();
  ctx.font='700 16px "neue-haas-grotesk-display", sans-serif';
  ctx.letterSpacing='2px';
  ctx.fillStyle=INK;
  ctx.fillText('X  @FD_RYOGA_JP',LX+26,589);
  ctx.letterSpacing='0px';

  /* 写真（公式切り抜き・下端合わせ・最前面＝文字サンド） */
  ctx.save();
  ctx.shadowColor='rgba(58,79,208,.3)';ctx.shadowBlur=46;ctx.shadowOffsetY=18;
  ctx.drawImage(img,px,py,pw,ph);
  ctx.restore();

  /* スタンプ（鍵穴入り・写真の左肩に重ねる） */
  const scx=px+358, scy=310, R=60;
  ctx.save();
  ctx.translate(scx,scy);
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
  ctx.fillStyle=SPARK;ctx.beginPath();ctx.arc(0,0,25,0,7);ctx.fill();
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(0,-4,5.4,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(-4.6,10);ctx.lineTo(4.6,10);ctx.closePath();ctx.fill();
  const msg='KO1KEYZ · IIZUKA RYOGA · DEBUT ERA · ';
  ctx.font='700 10.5px "neue-haas-grotesk-display", sans-serif';
  ctx.fillStyle=INK;
  ctx.textAlign='center';
  for(let i=0;i<msg.length;i++){
    const ang=-Math.PI/2 + i*(Math.PI*2/msg.length);
    ctx.save();ctx.rotate(ang);ctx.translate(0,-46);ctx.fillText(msg[i],0,0);ctx.restore();
  }
  ctx.restore();
  ctx.textAlign='left';

  /* ノイズ（うっすら） */
  const nz=document.createElement('canvas');nz.width=nz.height=240;
  const nctx=nz.getContext('2d');
  const nd=nctx.createImageData(240,240);
  for(let i=0;i<nd.data.length;i+=4){const v=Math.random()*255|0;nd.data[i]=nd.data[i+1]=nd.data[i+2]=v;nd.data[i+3]=14;}
  nctx.putImageData(nd,0,0);
  ctx.save();ctx.globalAlpha=.5;ctx.fillStyle=ctx.createPattern(nz,'repeat');ctx.fillRect(0,0,W,H);ctx.restore();
}

function exportBlob(cb){cv.toBlob(cb,'image/jpeg',0.92);}

document.getElementById('dl').addEventListener('click',()=>{
  exportBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ogp.jpg';a.click();});
});

window.__ogpSaved=false;
function autoSave(){
  exportBlob(b=>{
    fetch('http://127.0.0.1:4174/',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:b})
      .then(r=>r.json()).then(j=>{window.__ogpSaved=j.saved||true;document.getElementById('status').textContent='保存完了（'+j.saved+' bytes）';})
      .catch(()=>{document.getElementById('status').textContent='描画完了（ダウンロードボタンで保存してください）';});
  });
}

let waited=0;
const boot=setInterval(()=>{
  waited+=250;
  const imgsOk=img.complete&&logo.complete;
  if((fontsReady()&&imgsOk)||waited>12000){
    clearInterval(boot);
    draw();
    document.getElementById('status').textContent='描画完了';
    if(new URLSearchParams(location.search).has('auto'))autoSave();
  }
},250);
</script>
</body>
</html>
